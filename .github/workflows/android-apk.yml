
name: Build ASHFALL Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.gdshader'
      - '**.png'
      - '**.jpg'
      - '**.webp'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: ashfall-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Export debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GODOT_VERSION: '4.7.1'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Download Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          curl -fL "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip

          curl -fL "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/godot-templates.tpz

          mkdir -p /tmp/godot-bin

          unzip -q /tmp/godot.zip -d /tmp/godot-bin

          sudo install -m 0755 "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p /tmp/godot-templates

          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          godot --version

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS

      - name: Import project and install Android build template
        run: |
          mkdir -p export

          godot --headless --editor --path . --import

          godot --headless --path . --install-android-build-template --export-debug "Android APK" export/ashfall.apk

      - name: Verify APK was created
        run: |
          test -s export/ashfall.apk

          file export/ashfall.apk

          unzip -t export/ashfall.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASHFALL-Android-APK
          path: export/ashfall.apk
          if-no-files-found: error
          retention-days: 14
